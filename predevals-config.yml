schema_version: https://raw.githubusercontent.com/hubverse-org/hubPredEvalsData/main/inst/schema/v1.1.0/config_schema.json
rounds_idx: 0
transform_defaults:
  fun: log_shift
  args:
    offset: 1
  label: log
targets:
- target_id: SARI
  metrics:
  - wis
  - ae_median
  - interval_coverage_50
  - interval_coverage_95
  relative_metrics:
  - wis
  - ae_median
  baseline: MicroHub-Regular_Baseline
  disaggregate_by:
  - age_group
  - reference_date
  - horizon
  - target_end_date
eval_sets:
- eval_set_name: 2026 season, Overall
  task_filters:
    age_group:
    - "Overall"
    horizon:
    - -5
    - -4
    - -3
    - -2
    - -1
    - 0
    - 1
    - 2
    - 3
    reference_date:
    - "2026-05-30"
    - "2026-06-06"
    - "2026-06-13"
    - "2026-06-20"
    - "2026-06-27"
- eval_set_name: 2026 season, Adults
